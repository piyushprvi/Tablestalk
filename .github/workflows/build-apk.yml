name: Build TabletPilot Debug APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties
      - name: Generate gradlew
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -P /tmp
          unzip -q /tmp/gradle-8.11.1-bin.zip -d /opt/gradle
          /opt/gradle/gradle-8.11.1/bin/gradle wrapper
          chmod +x gradlew
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TabletPilot-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

name: Build TabletPilot Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;34.0.0"

      - name: Configure Gradle Environment
        run: |
          mkdir -p ~/.gradle
          echo "android.useAndroidX=true" >> ~/.gradle/gradle.properties
          echo "android.nonTransitiveRClass=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dandroid.useAndroidX=true" >> ~/.gradle/gradle.properties
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.nonTransitiveRClass=true" >> gradle.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties

      - name: Generate wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -P /tmp
          unzip -q /tmp/gradle-8.11.1-bin.zip -d /opt/gradle
          /opt/gradle/gradle-8.11.1/bin/gradle wrapper
          chmod +x gradlew

      - name: Ensure Proguard Rules file exists
        run: touch app/proguard-rules.pro

      - name: Build Debug APK
        run: ./gradlew assembleDebug -Dandroid.useAndroidX=true -Dandroid.enableJetifier=true --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TabletPilot-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
